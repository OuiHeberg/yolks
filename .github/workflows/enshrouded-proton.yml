# Image d'exécution Enshrouded sous GE-Proton des serveurs OuiPanel :
#  - ghcr.io/ouiheberg/yolks:enshrouded-proton (games/enshrouded-proton), prévue
#    en second choix de l'egg Enshrouded 8034, qui tourne aujourd'hui sous
#    ghcr.io/ptero-eggs/yolks:wine_latest.
# Workflow à part de steam.yml, sur le même modèle : une modification de cette
# image ne republie ni :dayz ni :steam-installer.
#
# Sur une pull request : construction et contrôles sans réseau, RIEN n'est publié.
# Sur main (push, lundi 04:00 UTC, à la main) : les mêmes contrôles, puis publication
# du tag courant et d'un tag daté (retour arrière), puis tirage SANS identifiant.
name: build enshrouded-proton
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi 04:00 UTC : mises à jour Debian de la base
  pull_request:
    paths:
      - games/enshrouded-proton/**
      - .github/workflows/enshrouded-proton.yml
  push:
    branches:
      - main
    paths:
      - games/enshrouded-proton/**
      - .github/workflows/enshrouded-proton.yml
permissions:
  contents: read

jobs:
  enshrouded-proton:
    name: "yolks:enshrouded-proton"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ouiheberg/yolks
    steps:
      - uses: actions/checkout@v7
      - name: Syntaxe des scripts
        run: |
          bash -n games/enshrouded-proton/entrypoint.sh
          bash -n games/enshrouded-proton/tests/image-check.sh
          bash -n games/enshrouded-proton/tests/entrypoint-check.sh
      - id: t
        name: Tag daté
        run: echo "dated=enshrouded-proton-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./games/enshrouded-proton
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:enshrouded-proton
            ${{ env.IMAGE }}:${{ steps.t.outputs.dated }}
      - name: Contrôle sans réseau de l'image (Proton, patch lsteamclient, UID 988, variables)
        run: |
          docker run --rm --network none -v "$PWD/games/enshrouded-proton/tests:/tests:ro" \
            --entrypoint bash "$IMAGE:enshrouded-proton" /tests/image-check.sh
      - name: Contrôle sans réseau de l'entrypoint et de la commande de démarrage (réglages de Wings)
        run: bash games/enshrouded-proton/tests/entrypoint-check.sh "$IMAGE:enshrouded-proton"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        name: Publication
        run: |
          docker push "$IMAGE:enshrouded-proton"
          docker push "$IMAGE:${{ steps.t.outputs.dated }}"
      - if: github.event_name != 'pull_request'
        name: Tirage sans identifiant (paquet public) et contrôle de l'image publiée
        run: |
          docker logout ghcr.io
          docker image rm "$IMAGE:enshrouded-proton" "$IMAGE:${{ steps.t.outputs.dated }}"
          docker pull "$IMAGE:enshrouded-proton"
          docker run --rm --network none -v "$PWD/games/enshrouded-proton/tests:/tests:ro" \
            --entrypoint bash "$IMAGE:enshrouded-proton" /tests/image-check.sh
