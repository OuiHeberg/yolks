# Images Node.js des serveurs clients OuiPanel (ghcr.io/ouiheberg/yolks:nodejs_XX).
# Dockerfiles repris de pelican-eggs/yolks@9db46b2 (licence MIT), base Node épinglée.
name: build nodejs
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # chaque lundi 03:00 UTC : mises à jour Debian de la base
  push:
    branches:
      - main
    paths:
      - nodejs/**
      - .github/workflows/nodejs.yml
permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "yolks:nodejs_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        name: Version de Node de la base
        run: echo "node=$(sed -nE 's#^FROM .*node:([0-9]+\.[0-9]+\.[0-9]+)-.*#\1#p' nodejs/${{ matrix.tag }}/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          file: ./nodejs/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/ouiheberg/yolks:nodejs_${{ matrix.tag }}
            ghcr.io/ouiheberg/yolks:nodejs_${{ matrix.tag }}-${{ steps.v.outputs.node }}
      - name: Contrôle de la version publiée
        run: |
          docker pull ghcr.io/ouiheberg/yolks:nodejs_${{ matrix.tag }}
          docker run --rm --entrypoint node ghcr.io/ouiheberg/yolks:nodejs_${{ matrix.tag }} --version | grep -x "v${{ steps.v.outputs.node }}"
